<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc"><title id="title">Color approximation</title><desc id="desc">A continuous gradient, stepped colors and a textured approximation. Illustration, not benchmark.</desc><defs><linearGradient id="g"><stop stop-color="#215a83"/><stop offset="1" stop-color="#e8c3a1"/></linearGradient><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#9aabb5"/><circle cx="3" cy="3" r="2" fill="#366482"/><circle cx="9" cy="9" r="2" fill="#e3c1a4"/></pattern></defs><rect width="960" height="260" rx="20" fill="#dbe2ea"/><rect x="28" y="36" width="280" height="142" rx="10" fill="url(#g)"/><g><path d="M338 36h56v142h-56z" fill="#215a83"/><path d="M394 36h56v142h-56z" fill="#52758c"/><path d="M450 36h56v142h-56z" fill="#839095"/><path d="M506 36h56v142h-56z" fill="#b5aa9c"/><path d="M562 36h56v142h-56z" fill="#e8c3a1"/></g><rect x="648" y="36" width="280" height="142" rx="10" fill="url(#dots)"/><g fill="#303b48" font-family="sans-serif" font-size="18" text-anchor="middle"><text x="168" y="221">Smooth gradient</text><text x="478" y="221">Fewer shades</text><text x="788" y="221">Dithered approximation</text></g></svg>
